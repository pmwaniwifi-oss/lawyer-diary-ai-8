name: Build Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android platform
        run: flutter create --platforms=android --project-name lawyer_diary_ai_8 --org in.lawyerdiary .
      - name: Remove Flutter demo test
        run: rm -f test/widget_test.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Check Dart code
        run: flutter analyze
      - name: Build APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: lawyer-diary-offline-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
